name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check all scripts
        run: |
          find skills/ -name "*.py" -exec python -m py_compile {} +
          echo "All scripts compile successfully"

  skill-metadata:
    # Validates SKILL.md frontmatter against platform constraints.
    # Catches description-length regressions at PR time so we don't ship
    # a release where a skill is rejected on load by Codex (1024-char cap).
    # See KH-327 (post-rc.1 incident) for the motivating case.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check SKILL.md description lengths
        run: python3 .github/scripts/check_skill_metadata.py

  smoke-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: analyze_schematic.py --help
        run: python3 skills/kicad/scripts/analyze_schematic.py --help > /dev/null

      - name: analyze_pcb.py --help
        run: python3 skills/kicad/scripts/analyze_pcb.py --help > /dev/null

      - name: analyze_gerbers.py --help
        run: python3 skills/kicad/scripts/analyze_gerbers.py --help > /dev/null

      - name: analyze_emc.py --help
        run: python3 skills/emc/scripts/analyze_emc.py --help > /dev/null

      - name: simulate_subcircuits.py --help
        run: python3 skills/spice/scripts/simulate_subcircuits.py --help > /dev/null

      - name: bom_manager.py --help
        run: python3 skills/bom/scripts/bom_manager.py --help > /dev/null

      - name: search_lcsc.py --help
        run: python3 skills/lcsc/scripts/search_lcsc.py --help > /dev/null

      - name: search_lcsc unit tests
        run: python3 -m unittest skills/lcsc/scripts/test_search_lcsc.py

      - name: datasheet_verify v1.4 cache round-trip smoke
        run: python3 skills/datasheets/scripts/_smoke_v14_roundtrip.py

  harness-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Clone test harness at pinned commit
        run: |
          git clone https://github.com/aklofas/kicad-happy-testharness.git /tmp/harness
          cd /tmp/harness
          git checkout ad39b91c530

      - name: Install harness dev deps (pytest, jsonschema, referencing, pyyaml)
        run: python -m pip install --disable-pip-version-check -r /tmp/harness/requirements-dev.txt

      - name: Run smoke tests (~30s, 565-test PR-gate subset, no corpus dep)
        env:
          KICAD_HAPPY_DIR: ${{ github.workspace }}
        run: |
          cd /tmp/harness
          python3 run_tests.py --smoke

      - name: Run schema-contract suite (validates analyzer envelopes against declared schemas)
        env:
          KICAD_HAPPY_DIR: ${{ github.workspace }}
        run: |
          cd /tmp/harness
          python -m pytest tests/contract/ -v

      - name: Determinism guard (run twice, unpinned hash seed, diff minus inputs/capability_mode_ref)
        run: |
          cd "$KICAD_HAPPY_DIR"
          SCH=/tmp/harness/tests/fixtures/simple-project/simple.kicad_sch
          PCB=/tmp/harness/tests/fixtures/simple-project/simple.kicad_pcb
          mkdir -p /tmp/det-guard/sch /tmp/det-guard/pcb

          for i in 1 2; do
            python3 skills/kicad/scripts/analyze_schematic.py "$SCH" --output /tmp/det-guard/sch/run_$i.json
            python3 -c "import json; d=json.load(open('/tmp/det-guard/sch/run_$i.json')); d.pop('inputs', None); d.pop('capability_mode_ref', None); json.dump(d, open('/tmp/det-guard/sch/run_$i.norm.json','w'), sort_keys=True)"
          done
          cmp /tmp/det-guard/sch/run_1.norm.json /tmp/det-guard/sch/run_2.norm.json

          for i in 1 2; do
            python3 skills/kicad/scripts/analyze_pcb.py "$PCB" --full --output /tmp/det-guard/pcb/run_$i.json
            python3 -c "import json; d=json.load(open('/tmp/det-guard/pcb/run_$i.json')); d.pop('inputs', None); d.pop('capability_mode_ref', None); json.dump(d, open('/tmp/det-guard/pcb/run_$i.norm.json','w'), sort_keys=True)"
          done
          cmp /tmp/det-guard/pcb/run_1.norm.json /tmp/det-guard/pcb/run_2.norm.json
        env:
          KICAD_HAPPY_DIR: ${{ github.workspace }}
