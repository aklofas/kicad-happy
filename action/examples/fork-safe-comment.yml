# Fork-safe comment posting workflow (companion to fork-safe.yml)
# This workflow runs with write permissions after the analysis workflow completes.
#
# Add this file to your KiCad project repo at:
#   .github/workflows/kicad-comment.yml

name: Post Review Comment
on:
  workflow_run:
    workflows: ['KiCad Analysis']
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kicad-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: kicad-review-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # pr-number.txt comes from the (possibly fork-controlled) analysis run, so
      # accept only a plain integer and only the PR whose head is the analysed commit.
      - id: pr-number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          n=$(head -c 32 pr-number.txt | tr -d '\r\n')
          if [ -z "$n" ]; then echo "::notice::no pull request number; not commenting"; exit 0; fi
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::pr-number.txt is not a PR number"; exit 1; }
          sha=$(gh api "repos/$REPO/pulls/$n" --jq .head.sha) || exit 1
          if [ "$sha" != "$HEAD_SHA" ]; then
            echo "::warning::PR #$n head is not the analysed commit; not commenting"
            exit 0
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - if: steps.pr-number.outputs.number != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: report.md
          comment-tag: kicad-happy-review
          mode: upsert
          pr-number: ${{ steps.pr-number.outputs.number }}
